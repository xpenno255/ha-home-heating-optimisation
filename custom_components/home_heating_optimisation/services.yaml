record_adjustment:
  fields:
    note:
      required: true
      selector:
        text:
          multiline: true
    kind:
      default: other
      selector:
        select:
          options:
            - lockshield
            - boiler_setting
            - sensor_change
            - other
    room_id:
      selector:
        text:
get_report:
get_journal:
  fields:
    kinds:
      selector:
        select:
          multiple: true
          options:
            - decision
            - command_requested
            - command_sent
            - command_result
            - readback
            - manual_override
            - schedule_change
            - mode_change
            - handover
            - rollback
            - adjustment_note
            - gateway
            - energy
            - recommendation
            - trial
            - advisor_report
            - advisor_followup
            - migration
    room_id:
      selector:
        text:
    hours:
      default: 24
      selector:
        number:
          min: 0
          max: 720
          unit_of_measurement: h
    include_private:
      default: false
      selector:
        boolean:
get_energy_report:
  fields:
    days:
      default: 7
      selector:
        number:
          min: 1
          max: 90
          mode: box
