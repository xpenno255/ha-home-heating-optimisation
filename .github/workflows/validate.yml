name: Validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install -r requirements-test.txt
      - run: ruff check custom_components tests scripts
      - run: ruff format --check custom_components tests scripts
      - run: pytest -q
      - run: python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: home-heating-optimisation
          path: dist/*.zip
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          comment: false
          # The licence check queries GitHub's default branch, still the initial
          # README until this PR merges. Package tests check the actual MIT file.
          # main runs the full check without this bootstrap exception.
          ignore: ${{ (github.head_ref == 'feature/observation-foundation' || github.ref == 'refs/heads/feature/observation-foundation') && 'license' || '' }}
